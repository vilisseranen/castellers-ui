# Security headers, included in every location: nginx does not inherit
# add_header into a location that defines its own add_header.
#
# Content-Security-Policy:
# - scripts and fonts only from the app itself (FontAwesome is bundled);
# - inline styles are needed by Vue style bindings and by Leaflet;
# - map tiles come from OpenStreetMap;
# - API calls go to the API host (VUE_APP_API_URL in .env.production).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.osm.org https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.amunt.castellersdemontreal.info; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
